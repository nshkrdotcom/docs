version: "0.1.1"
project: "cns-gcts"

corpus:
  type: "local_jsonl"
  path: "data/corpus.jsonl"
  evidence_id_field: "doc_id"
  text_field: "text"

retrieval:
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  top_k: 20

llm:
  extraction_model: "provider/model-name"
  rendering_model: "provider/model-name"
  access_model: "provider/model-name"
  temperature_extraction: 0.1
  temperature_rendering: 0.2
  temperature_access: 0.1
  truth_decision_allowed: false

grounding:
  citation_required: true
  entailment_model: "nli-model-name"
  entailment_threshold: 0.75
  reject_unresolved_references: true

access_modeling:
  enabled: true
  access_states:
    - available
    - inaccessible
    - sealed
    - withheld
    - destroyed
    - not_generated
    - unknown
  require_record_duty_for_evidence_of_absence: true
  record_duty_threshold: 0.65
  expected_observability_threshold: 0.65
  allow_suppression_as_strict_proof: false
  benign_missingness_world_required: true

institutional_incentives:
  enabled: true
  features:
    - record_control
    - exposure_if_claim_true
    - incentive_to_disclose
    - incentive_to_conceal
    - concealment_penalty
    - source_reliability_prior
  can_directly_promote_truth: false

tensor_logic:
  strict_temperature: 0.0
  soft_temperature: 0.4
  access_temperature: 0.6
  allow_soft_promotion: false
  allow_access_promotion_to_strict: false

worlds:
  beam_size: 20
  max_assumptions: 4
  max_access_hypotheses: 4
  posterior_temperature: 1.0
  weights:
    grounding: 2.0
    contradiction: 2.0
    rule: 1.0
    parsimony: 0.5
    support: 2.0
    access: 1.5
    incentive: 0.8

chirality:
  use_graph_chirality: true
  use_round_trip_chirality: true
  use_residual_energy: true
  use_access_chirality: true

oracle_boundary:
  labels_available_at_runtime: false
  fail_if_labels_available: true
  access_gold_available_at_runtime: false
  fail_if_access_gold_available: true

evaluation:
  metrics:
    - citation_validity
    - zthr
    - brier
    - ece
    - top_k_world_coverage
    - abstention_precision
    - chirality_predictiveness
    - access_state_f1
    - false_absence_penalty_rate
    - suppression_hypothesis_precision
