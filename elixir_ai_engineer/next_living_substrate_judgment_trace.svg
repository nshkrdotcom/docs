<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">Living Substrate — judgment trace factory</title>
  <desc id="desc">A zoom-in diagram showing how a SpecCell and governed execution context produce candidate code, evidence, normal form, accepted artifacts, and lineage traces that feed harness evolution.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#ded8c9" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#73dfbf" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#b9b4ff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="frameGrad" x1="40" y1="40" x2="1360" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#171b25"/>
      <stop offset="1" stop-color="#090b10"/>
    </linearGradient>
    <linearGradient id="govGrad" x1="88" y1="96" x2="1312" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#332a78"/>
      <stop offset="1" stop-color="#1b1747"/>
    </linearGradient>
    <linearGradient id="mainGrad" x1="88" y1="252" x2="1312" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0e3f70"/>
      <stop offset="1" stop-color="#0a2b52"/>
    </linearGradient>
    <linearGradient id="failGrad" x1="88" y1="660" x2="1312" y2="874" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6b3614"/>
      <stop offset="1" stop-color="#2b1b10"/>
    </linearGradient>
    <style>
      :root {
        --bg:#07090d; --ink:#f3f1e8; --muted:#c9c4b8; --dim:#9f9a90;
        --blue:#91c8ff; --blueStrong:#c8e4ff; --teal:#73dfbf; --tealStrong:#b9f2df;
        --purple:#a9a3f3; --purpleStrong:#d2cef8; --amber:#f4a62a; --red:#ffb199;
        --card:#171b24; --stroke:#817c70;
      }
      .font { font-family:"Anthropic Sans", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size:32px; font-weight:700; letter-spacing:-0.025em; fill:var(--ink); }
      .subtitle { font-size:16px; fill:var(--muted); }
      .panel-label { font-size:13px; font-weight:750; letter-spacing:0.11em; text-transform:uppercase; fill:var(--muted); }
      .node-title { font-size:18px; font-weight:700; fill:var(--ink); }
      .node-sub { font-size:13px; fill:var(--muted); }
      .micro { font-size:12px; fill:var(--dim); }
      .arrow { fill:none; stroke:#ded8c9; stroke-width:2.1; marker-end:url(#arrow); }
      .arrow-soft { fill:none; stroke:#ded8c9; stroke-width:1.6; stroke-opacity:.62; marker-end:url(#arrow); }
      .arrow-teal { fill:none; stroke:#73dfbf; stroke-width:2.0; marker-end:url(#arrowTeal); }
      .arrow-purple { fill:none; stroke:#b9b4ff; stroke-width:2.0; marker-end:url(#arrowPurple); }
      .dash { fill:none; stroke:#ded8c9; stroke-width:1.7; stroke-dasharray:7 8; stroke-opacity:.72; marker-end:url(#arrow); }
      .dash-teal { fill:none; stroke:#73dfbf; stroke-width:1.9; stroke-dasharray:8 8; marker-end:url(#arrowTeal); }
      .dash-purple { fill:none; stroke:#b9b4ff; stroke-width:1.9; stroke-dasharray:8 8; marker-end:url(#arrowPurple); }
      .card { fill:#141922; stroke:#7f7a70; stroke-width:1.1; }
      .cardBlue { fill:#12375e; stroke:#80bdff; stroke-width:1.2; }
      .cardTeal { fill:#0d4a3e; stroke:#73dfbf; stroke-width:1.2; }
      .cardPurple { fill:#292566; stroke:#b9b4ff; stroke-width:1.2; }
      .cardAmber { fill:#392414; stroke:#f4a62a; stroke-width:1.2; }
      .pill { fill:#0d1118; stroke:#6f6a61; stroke-width:1; }
    </style>
  </defs>

  <rect width="1400" height="1000" fill="#07090d"/>
  <g class="font" filter="url(#softShadow)">
    <rect x="40" y="40" width="1320" height="920" rx="34" fill="url(#frameGrad)" stroke="#3d4250" stroke-width="1.4"/>

    <text class="title" x="700" y="88" text-anchor="middle">Living Substrate — judgment trace factory</text>
    <text class="subtitle" x="700" y="116" text-anchor="middle">the next zoom layer: every candidate becomes evidence, normal form, lineage, or a new rule</text>

    <!-- Governance ribbon -->
    <rect x="88" y="146" width="1224" height="118" rx="24" fill="url(#govGrad)" stroke="#b9b4ff" stroke-width="1.25"/>
    <text class="panel-label" x="116" y="178">GOVERNANCE SURFACE — CONSTRAINS EVERY OPERATOR</text>

    <g id="governance-nodes">
      <rect class="cardPurple" x="128" y="196" width="210" height="44" rx="14"/>
      <text class="node-title" x="233" y="215" text-anchor="middle">ExecutionContext</text>
      <text class="node-sub" x="233" y="233" text-anchor="middle">tenant • session • actor</text>

      <rect class="cardPurple" x="370" y="196" width="210" height="44" rx="14"/>
      <text class="node-title" x="475" y="215" text-anchor="middle">AccessGraph</text>
      <text class="node-sub" x="475" y="233" text-anchor="middle">scope • edges • authority</text>

      <rect class="cardPurple" x="612" y="196" width="210" height="44" rx="14"/>
      <text class="node-title" x="717" y="215" text-anchor="middle">Π Token Chain</text>
      <text class="node-sub" x="717" y="233" text-anchor="middle">proof of delegated action</text>

      <rect class="cardPurple" x="854" y="196" width="210" height="44" rx="14"/>
      <text class="node-title" x="959" y="215" text-anchor="middle">Credential Lease</text>
      <text class="node-sub" x="959" y="233" text-anchor="middle">redeem only at boundary</text>

      <rect class="cardPurple" x="1096" y="196" width="176" height="44" rx="14"/>
      <text class="node-title" x="1184" y="215" text-anchor="middle">Effect Budget</text>
      <text class="node-sub" x="1184" y="233" text-anchor="middle">declared or denied</text>
    </g>

    <!-- Main lowering trajectory -->
    <rect x="88" y="302" width="1224" height="326" rx="28" fill="url(#mainGrad)" stroke="#80bdff" stroke-width="1.25"/>
    <text class="panel-label" x="116" y="336">LOWERING TRAJECTORY — BOUNDED MUTATION INTO ENGINEERING NORMAL FORM</text>

    <!-- top stage labels -->
    <g id="stage-cards">
      <rect class="cardBlue" x="126" y="374" width="142" height="74" rx="16"/>
      <text class="node-title" x="197" y="400" text-anchor="middle">SpecCell</text>
      <text class="node-sub" x="197" y="420" text-anchor="middle">contracts</text>
      <text class="node-sub" x="197" y="438" text-anchor="middle">effects • tests</text>

      <rect class="cardBlue" x="306" y="374" width="142" height="74" rx="16"/>
      <text class="node-title" x="377" y="400" text-anchor="middle">Bundle</text>
      <text class="node-sub" x="377" y="420" text-anchor="middle">minimal context</text>
      <text class="node-sub" x="377" y="438" text-anchor="middle">no ambient scope</text>

      <rect class="cardBlue" x="486" y="374" width="142" height="74" rx="16"/>
      <text class="node-title" x="557" y="400" text-anchor="middle">Candidate</text>
      <text class="node-sub" x="557" y="420" text-anchor="middle">skeleton + fill</text>
      <text class="node-sub" x="557" y="438" text-anchor="middle">patch proposal</text>

      <rect class="cardBlue" x="666" y="374" width="142" height="74" rx="16"/>
      <text class="node-title" x="737" y="400" text-anchor="middle">Extract</text>
      <text class="node-sub" x="737" y="420" text-anchor="middle">ImplGraph</text>
      <text class="node-sub" x="737" y="438" text-anchor="middle">delta class</text>

      <rect class="cardBlue" x="846" y="374" width="142" height="74" rx="16"/>
      <text class="node-title" x="917" y="400" text-anchor="middle">Evidence</text>
      <text class="node-sub" x="917" y="420" text-anchor="middle">compile • tests</text>
      <text class="node-sub" x="917" y="438" text-anchor="middle">properties</text>

      <rect class="cardBlue" x="1026" y="374" width="142" height="74" rx="16"/>
      <text class="node-title" x="1097" y="400" text-anchor="middle">ENF Audit</text>
      <text class="node-sub" x="1097" y="420" text-anchor="middle">cost model</text>
      <text class="node-sub" x="1097" y="438" text-anchor="middle">shape budget</text>
    </g>

    <path class="arrow" d="M268 411 H306"/>
    <path class="arrow" d="M448 411 H486"/>
    <path class="arrow" d="M628 411 H666"/>
    <path class="arrow" d="M808 411 H846"/>
    <path class="arrow" d="M988 411 H1026"/>

    <!-- outcome rail -->
    <rect class="pill" x="126" y="504" width="1042" height="78" rx="19"/>
    <text class="micro" x="156" y="532">trace payload</text>
    <text class="node-title" x="156" y="560">spec → candidate → graph delta → violations → rewrites → evidence → accepted normal form</text>

    <rect class="cardTeal" x="1196" y="492" width="76" height="102" rx="18"/>
    <text class="node-title" x="1234" y="528" text-anchor="middle">Trace</text>
    <text class="node-sub" x="1234" y="550" text-anchor="middle">Store</text>
    <text class="node-sub" x="1234" y="572" text-anchor="middle">append</text>
    <path class="arrow-teal" d="M1168 543 H1196"/>

    <!-- governance drops -->
    <path class="dash-purple" d="M233 240 V328"/>
    <path class="dash-purple" d="M475 240 C475 280 557 286 557 374"/>
    <path class="dash-purple" d="M717 240 C717 280 737 286 737 374"/>
    <path class="dash-purple" d="M959 240 C959 280 917 286 917 374"/>
    <path class="dash-purple" d="M1184 240 C1184 282 1097 286 1097 374"/>

    <!-- failure / learning loop -->
    <rect x="88" y="676" width="1224" height="206" rx="28" fill="url(#failGrad)" stroke="#f4a62a" stroke-width="1.25"/>
    <text class="panel-label" x="116" y="710">FAILURE MATERIALIZATION — REJECTION BECOMES SUBSTRATE</text>

    <rect class="cardAmber" x="126" y="744" width="198" height="74" rx="16"/>
    <text class="node-title" x="225" y="771" text-anchor="middle">Violation</text>
    <text class="node-sub" x="225" y="791" text-anchor="middle">scope • bloat • effect</text>
    <text class="node-sub" x="225" y="809" text-anchor="middle">counterexample found</text>

    <rect class="cardAmber" x="374" y="744" width="198" height="74" rx="16"/>
    <text class="node-title" x="473" y="771" text-anchor="middle">Classifier</text>
    <text class="node-sub" x="473" y="791" text-anchor="middle">violation vs omission</text>
    <text class="node-sub" x="473" y="809" text-anchor="middle">bloat vs refinement</text>

    <rect class="cardAmber" x="622" y="744" width="198" height="74" rx="16"/>
    <text class="node-title" x="721" y="771" text-anchor="middle">Compiler</text>
    <text class="node-sub" x="721" y="791" text-anchor="middle">rule • test • nogood</text>
    <text class="node-sub" x="721" y="809" text-anchor="middle">normalizer candidate</text>

    <rect class="cardAmber" x="870" y="744" width="198" height="74" rx="16"/>
    <text class="node-title" x="969" y="771" text-anchor="middle">Policy Update</text>
    <text class="node-sub" x="969" y="791" text-anchor="middle">ENF weights</text>
    <text class="node-sub" x="969" y="809" text-anchor="middle">operator routing</text>

    <rect class="cardTeal" x="1118" y="744" width="154" height="74" rx="16"/>
    <text class="node-title" x="1195" y="771" text-anchor="middle">Next Run</text>
    <text class="node-sub" x="1195" y="791" text-anchor="middle">stricter bundle</text>
    <text class="node-sub" x="1195" y="809" text-anchor="middle">better harness</text>

    <path class="arrow" d="M324 781 H374"/>
    <path class="arrow" d="M572 781 H622"/>
    <path class="arrow" d="M820 781 H870"/>
    <path class="arrow-teal" d="M1068 781 H1118"/>

    <!-- fail paths from trajectory -->
    <path class="dash" d="M1097 448 C1097 612 225 610 225 744"/>
    <text class="micro" x="642" y="646" text-anchor="middle">if budget fails, the rejected structure is not discarded; it becomes labeled training signal</text>

    <!-- loop back to start -->
    <path class="dash-teal" d="M1195 744 C1195 666 1260 654 1260 430 C1260 336 198 335 197 374"/>

    <!-- Footer statement -->
    <rect x="212" y="908" width="976" height="30" rx="15" fill="#0d1118" stroke="#5e5a52" stroke-width="1"/>
    <text class="micro" x="700" y="928" text-anchor="middle">failure is not a retry prompt — failure is a rule, a test, a cost update, a spec refinement, or a forbidden pattern</text>
  </g>
</svg>
