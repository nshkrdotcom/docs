<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Elixir AI Engineer — the living substrate</title>
  <desc id="desc">A cleaned geometric diagram of three nested feedback loops: candidate generation, normalization, and harness evolution, operating over a continuously projected five-graph substrate.</desc>

  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M2 2 L10 6 L2 10" fill="none" stroke="#d8d5ca" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="outerGrad" x1="64" y1="64" x2="1136" y2="1424" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F46A6"/>
      <stop offset="1" stop-color="#312A79"/>
    </linearGradient>
    <linearGradient id="middleGrad" x1="112" y1="132" x2="1088" y2="1256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08745D"/>
      <stop offset="1" stop-color="#074E43"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="160" y1="210" x2="1040" y2="970" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#175A97"/>
      <stop offset="1" stop-color="#103F76"/>
    </linearGradient>
    <style>
      :root {
        --bg: #07090d;
        --ink: #f3f1e8;
        --muted: #c9c4b8;
        --dim: #9f9a90;
        --purple: #a9a3f3;
        --purple-strong: #d2cef8;
        --teal: #73dfbf;
        --teal-strong: #b9f2df;
        --blue: #91c8ff;
        --blue-strong: #c8e4ff;
        --amber: #f4a62a;
        --amber-dim: #312410;
        --card: #47453f;
        --card-stroke: #848176;
      }
      .font { font-family: "Anthropic Sans", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { font-size: 18px; letter-spacing: 0.01em; fill: #c9c4b8; }
      .micro { font-size: 15px; fill: #9f9a90; }
      .title { font-size: 28px; font-weight: 650; fill: #f3f1e8; letter-spacing: -0.02em; }
      .subtitle { font-size: 16px; fill: #c9c4b8; }
      .node-title { font-size: 20px; font-weight: 650; fill: #c8e4ff; }
      .node-sub { font-size: 15px; fill: #91c8ff; }
      .teal-title { font-size: 20px; font-weight: 650; fill: #b9f2df; }
      .teal-sub { font-size: 15px; fill: #73dfbf; }
      .purple-title { font-size: 20px; font-weight: 650; fill: #d2cef8; }
      .purple-sub { font-size: 15px; fill: #a9a3f3; }
      .arrow { fill: none; stroke: #d8d5ca; stroke-width: 2.2; marker-end: url(#arrow); }
      .dash-blue { fill: none; stroke: #65a6e8; stroke-width: 1.7; stroke-dasharray: 7 8; marker-end: url(#arrow); color: #65a6e8; }
      .dash-teal { fill: none; stroke: #3ed0a3; stroke-width: 1.8; stroke-dasharray: 8 8; marker-end: url(#arrow); color: #3ed0a3; }
      .dash-purple { fill: none; stroke: #9b95ef; stroke-width: 1.8; stroke-dasharray: 8 8; marker-end: url(#arrow); color: #9b95ef; }
      .smallcaps { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    </style>
  </defs>

  <rect width="1200" height="1500" fill="#07090d"/>

  <g class="font" filter="url(#softShadow)">
    <!-- Header -->
    <text class="title" x="600" y="48" text-anchor="middle">Elixir AI Engineer — the living substrate</text>

    <!-- Three nested loops -->
    <rect x="64" y="64" width="1072" height="1360" rx="32" fill="url(#outerGrad)" stroke="#b9b4ff" stroke-width="1.5"/>
    <text class="label" x="96" y="104">harness evolution loop — updates rules, costs, operators, and specs across sessions</text>

    <rect x="112" y="132" width="976" height="1124" rx="28" fill="url(#middleGrad)" stroke="#5fe0b5" stroke-width="1.3"/>
    <text class="label" x="144" y="172">normalization loop — compresses working code toward ENF after each candidate</text>

    <rect x="160" y="210" width="880" height="760" rx="24" fill="url(#innerGrad)" stroke="#8bc9ff" stroke-width="1.2"/>
    <text class="label" x="192" y="250">candidate loop — spec -> skeleton -> bounded LM fill -> evidence -> accept?</text>

    <!-- Candidate generation stack -->
    <g id="candidate-stack">
      <rect x="380" y="290" width="440" height="66" rx="14" fill="#5b5249" stroke="#b0a38e" stroke-width="1.2"/>
      <text class="node-title" x="600" y="318" text-anchor="middle" fill="#efe9dc">SpecCell</text>
      <text class="node-sub" x="600" y="340" text-anchor="middle" fill="#d7cfc0">contracts • effects • ENF budget</text>

      <path class="arrow" d="M600 356 L600 386"/>

      <rect x="330" y="386" width="540" height="66" rx="14" fill="#164f86" stroke="#6fb6fb" stroke-width="1.2"/>
      <text class="node-title" x="600" y="414" text-anchor="middle">Skeleton generator</text>
      <text class="node-sub" x="600" y="436" text-anchor="middle">deterministic scaffolding — no LM</text>

      <path class="arrow" d="M600 452 L600 482"/>

      <rect x="330" y="482" width="540" height="66" rx="14" fill="#164f86" stroke="#6fb6fb" stroke-width="1.2"/>
      <text class="node-title" x="600" y="510" text-anchor="middle">Context bundle</text>
      <text class="node-sub" x="600" y="532" text-anchor="middle">typed • scoped • forbidden list</text>

      <path class="arrow" d="M600 548 L600 578"/>

      <rect x="330" y="578" width="540" height="66" rx="14" fill="#164f86" stroke="#6fb6fb" stroke-width="1.2"/>
      <text class="node-title" x="600" y="606" text-anchor="middle">Bounded LM fill</text>
      <text class="node-sub" x="600" y="628" text-anchor="middle">fills holes only • no architecture invention</text>

      <path class="arrow" d="M600 644 L600 674"/>

      <rect x="330" y="674" width="540" height="66" rx="14" fill="#164f86" stroke="#6fb6fb" stroke-width="1.2"/>
      <text class="node-title" x="600" y="702" text-anchor="middle">Evidence gate</text>
      <text class="node-sub" x="600" y="724" text-anchor="middle">unit • property • fault • adversarial</text>
    </g>

    <path class="arrow" d="M600 740 L600 774"/>

    <!-- Fail repair loop -->
    <path class="dash-blue" d="M330 707 L252 707 L252 515 L318 515"/>
    <text class="micro" x="236" y="620" text-anchor="middle" transform="rotate(-90 236 620)" fill="#b7d9ff">fail -> repair</text>

    <!-- Substrate card -->
    <rect x="200" y="774" width="800" height="150" rx="22" fill="#4a4943" stroke="#9b978b" stroke-width="1.2"/>
    <text x="600" y="817" text-anchor="middle" style="font-size:22px;font-weight:650;fill:#f0eee7;">Substrate — continuously projected</text>

    <g id="graph-pills">
      <rect x="230" y="842" width="136" height="48" rx="10" fill="#54524d" stroke="#aaa69b" stroke-width="1.1"/>
      <text class="subtitle" x="298" y="872" text-anchor="middle">SpecGraph</text>

      <rect x="382" y="842" width="136" height="48" rx="10" fill="#54524d" stroke="#aaa69b" stroke-width="1.1"/>
      <text class="subtitle" x="450" y="872" text-anchor="middle">ImplGraph</text>

      <rect x="534" y="842" width="136" height="48" rx="10" fill="#54524d" stroke="#aaa69b" stroke-width="1.1"/>
      <text class="subtitle" x="602" y="872" text-anchor="middle">EvidenceGraph</text>

      <rect x="686" y="842" width="136" height="48" rx="10" fill="#54524d" stroke="#aaa69b" stroke-width="1.1"/>
      <text class="subtitle" x="754" y="872" text-anchor="middle">RuntimeGraph</text>

      <rect x="838" y="842" width="132" height="48" rx="10" fill="#54524d" stroke="#aaa69b" stroke-width="1.1"/>
      <text class="subtitle" x="904" y="872" text-anchor="middle">Lineage</text>
    </g>

    <text class="micro" x="600" y="910" text-anchor="middle">every code change projects continuously into all five graphs</text>

    <rect x="224" y="928" width="752" height="34" rx="17" fill="#2f250d" stroke="#c67d13" stroke-width="1.1"/>
    <text x="600" y="950" text-anchor="middle" style="font-size:15px;fill:#ffb13c;">drift classifier: conforming • violation • omission • bloat • refinement candidate • dead path</text>

    <!-- Substrate to normalization layer -->
    <path class="arrow" d="M600 970 L600 1016"/>

    <!-- Normalization layer -->
    <rect x="160" y="1016" width="420" height="86" rx="16" fill="#0b634f" stroke="#63deb4" stroke-width="1.2"/>
    <text class="teal-title" x="370" y="1050" text-anchor="middle">ENF auditor</text>
    <text class="teal-sub" x="370" y="1074" text-anchor="middle">module kind • process proof • API trace</text>

    <rect x="620" y="1016" width="420" height="86" rx="16" fill="#0b634f" stroke="#63deb4" stroke-width="1.2"/>
    <text class="teal-title" x="830" y="1050" text-anchor="middle">Cost model</text>
    <text class="teal-sub" x="830" y="1074" text-anchor="middle">module + process + API therefore pure bonus</text>

    <path class="arrow" d="M370 1102 L370 1144"/>
    <path class="arrow" d="M830 1102 L830 1144"/>

    <rect x="160" y="1144" width="880" height="86" rx="16" fill="#0b634f" stroke="#63deb4" stroke-width="1.2"/>
    <text class="teal-title" x="600" y="1178" text-anchor="middle">Compression normalizer</text>
    <text class="teal-sub" x="600" y="1202" text-anchor="middle">collapse fake behaviour • remove stateless GenServer • inline wrapper • shrink API</text>

    <!-- Middle loop repair path -->
    <path class="dash-teal" d="M160 1187 L128 1187 L128 852 L194 852"/>
    <text class="micro" x="112" y="1018" text-anchor="middle" transform="rotate(-90 112 1018)" fill="#9ff1d7">above budget -> compress</text>

    <path class="arrow" d="M600 1230 L600 1296"/>

    <!-- Harness evolution layer -->
    <rect x="160" y="1296" width="420" height="86" rx="16" fill="#423891" stroke="#b9b4ff" stroke-width="1.2"/>
    <text class="purple-title" x="370" y="1330" text-anchor="middle">Nogood compiler</text>
    <text class="purple-sub" x="370" y="1354" text-anchor="middle">failure -> rule -> gate -> CI</text>

    <rect x="620" y="1296" width="420" height="86" rx="16" fill="#423891" stroke="#b9b4ff" stroke-width="1.2"/>
    <text class="purple-title" x="830" y="1330" text-anchor="middle">Lineage + benchmark</text>
    <text class="purple-sub" x="830" y="1354" text-anchor="middle">judgment traces -> training signal</text>

    <!-- Outer loop path -->
    <path class="dash-purple" d="M1040 1339 L1104 1339 L1104 323 L1048 323"/>
    <text class="micro" x="1122" y="830" text-anchor="middle" transform="rotate(-90 1122 830)" fill="#d2cef8">refines ENF • costs • operators • spec</text>

    <!-- Legend -->
    <g transform="translate(160 1438)">
      <rect x="0" y="0" width="880" height="1" fill="#2b2d35"/>
      <circle cx="42" cy="25" r="6" fill="#a9a3f3"/>
      <text class="micro" x="60" y="30">purple = harness evolution</text>
      <circle cx="380" cy="25" r="6" fill="#73dfbf"/>
      <text class="micro" x="398" y="30">teal = normalization</text>
      <circle cx="665" cy="25" r="6" fill="#91c8ff"/>
      <text class="micro" x="683" y="30">blue = candidate loop</text>
    </g>
  </g>
</svg>
