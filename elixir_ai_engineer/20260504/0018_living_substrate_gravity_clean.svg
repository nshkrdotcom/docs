<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Living substrate — graph as center of gravity</title>
  <desc id="desc">A precise systems diagram showing a five-graph substrate at the center, orbited by specification input, language-model candidates, evidence and adversary loops, normalization, and harness evolution. Arrows show projections, proposed mutations, evidence, rejected drift, and learning loops.</desc>

  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#34342f"/>
      <stop offset="54%" stop-color="#23231f"/>
      <stop offset="100%" stop-color="#171715"/>
    </radialGradient>

    <linearGradient id="centerFill" x1="340" y1="282" x2="860" y2="578" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4a4942"/>
      <stop offset="100%" stop-color="#32322e"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.26"/>
    </filter>

    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#d7d1a8" flood-opacity="0.16"/>
    </filter>

    <marker id="arrowNeutral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1.8 1.2 L8.2 5 L1.8 8.8" fill="none" stroke="#c6c2b3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1.8 1.2 L8.2 5 L1.8 8.8" fill="none" stroke="#a39af6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1.8 1.2 L8.2 5 L1.8 8.8" fill="none" stroke="#73b8ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1.8 1.2 L8.2 5 L1.8 8.8" fill="none" stroke="#6ee0c3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowCoral" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1.8 1.2 L8.2 5 L1.8 8.8" fill="none" stroke="#f09a73" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <style>
      :root {
        --bg: #171715;
        --panel: #242421;
        --panel-2: #2b2b27;
        --stroke: #58564c;
        --stroke-soft: rgba(214, 210, 191, 0.23);
        --text: #f2efe3;
        --muted: #c9c4b3;
        --dim: #918d80;
        --purple: #a39af6;
        --purple-bg: #2f2a5d;
        --blue: #73b8ff;
        --blue-bg: #17375b;
        --teal: #6ee0c3;
        --teal-bg: #123f36;
        --coral: #f09a73;
        --coral-bg: #512a1d;
      }
      * { box-sizing: border-box; }
      svg { background: var(--bg); }
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-rendering: geometricPrecision; }
      .title { fill: var(--text); font-size: 30px; font-weight: 760; letter-spacing: -0.02em; }
      .subtitle { fill: var(--muted); font-size: 14px; font-weight: 430; }
      .card { fill: rgba(38, 38, 34, 0.96); stroke: var(--stroke-soft); stroke-width: 1.2; filter: url(#softShadow); }
      .center { fill: url(#centerFill); stroke: rgba(228, 224, 200, 0.42); stroke-width: 1.3; filter: url(#softShadow); }
      .center-ring { fill: none; stroke: rgba(222, 218, 196, 0.16); stroke-width: 1.2; stroke-dasharray: 7 9; }
      .orbit { fill: none; stroke: rgba(222, 218, 196, 0.10); stroke-width: 1.1; stroke-dasharray: 2 9; stroke-linecap: round; }
      .card-title { fill: var(--text); font-size: 17px; font-weight: 720; letter-spacing: -0.01em; }
      .card-kicker { font-size: 11px; font-weight: 760; letter-spacing: 0.12em; text-transform: uppercase; }
      .body { fill: var(--muted); font-size: 12.5px; font-weight: 440; }
      .small { fill: var(--dim); font-size: 11.5px; font-weight: 440; }
      .center-title { fill: var(--text); font-size: 22px; font-weight: 780; letter-spacing: -0.02em; }
      .center-subtitle { fill: var(--muted); font-size: 12.5px; font-weight: 460; }
      .pill { stroke-width: 1; }
      .pill-text { font-size: 12px; font-weight: 680; }
      .flow { fill: none; stroke-width: 1.45; stroke-linecap: round; stroke-linejoin: round; }
      .flow-soft { opacity: 0.72; }
      .label { font-size: 11.5px; font-weight: 650; paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
      .trace { fill: rgba(37, 37, 33, 0.98); stroke: rgba(214, 210, 191, 0.27); stroke-width: 1.1; filter: url(#softShadow); }
      .legend-text { fill: var(--muted); font-size: 11.5px; font-weight: 600; }
      .dot { stroke: rgba(255,255,255,0.18); stroke-width: 1; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="url(#bgGlow)"/>

  <g opacity="0.18">
    <path d="M80 150 H1120 M80 250 H1120 M80 350 H1120 M80 450 H1120 M80 550 H1120 M80 650 H1120 M80 750 H1120" stroke="#d8d2bd" stroke-width="0.6"/>
    <path d="M120 90 V812 M240 90 V812 M360 90 V812 M480 90 V812 M600 90 V812 M720 90 V812 M840 90 V812 M960 90 V812 M1080 90 V812" stroke="#d8d2bd" stroke-width="0.6"/>
  </g>

  <g transform="translate(72 54)">
    <text class="title" x="0" y="0" dominant-baseline="hanging">Living substrate: graph as center of gravity</text>
    <text class="subtitle" x="0" y="43">The harness is not a static pipeline. It is a governed substrate that projects, mutates, falsifies, normalizes, and evolves itself.</text>
  </g>

  <!-- Orbital guide geometry -->
  <ellipse class="orbit" cx="600" cy="425" rx="420" ry="272"/>
  <ellipse class="orbit" cx="600" cy="425" rx="300" ry="194"/>
  <circle class="center-ring" cx="600" cy="425" r="168"/>

  <!-- Flows behind nodes -->
  <g id="flows">
    <path class="flow flow-soft" d="M600 217 C600 248 600 266 600 292" stroke="#a39af6" marker-end="url(#arrowPurple)"/>
    <text class="label" x="614" y="264" fill="#a39af6">formal pressure</text>

    <path class="flow flow-soft" d="M346 338 C416 348 448 372 474 397" stroke="#73b8ff" marker-end="url(#arrowBlue)"/>
    <text class="label" x="375" y="351" fill="#73b8ff">proposed mutations</text>

    <path class="flow flow-soft" d="M854 338 C784 348 752 372 726 397" stroke="#6ee0c3" marker-end="url(#arrowTeal)"/>
    <text class="label" x="757" y="351" fill="#6ee0c3">counterexamples</text>

    <path class="flow flow-soft" d="M372 620 C442 586 474 548 502 504" stroke="#f09a73" marker-end="url(#arrowCoral)"/>
    <text class="label" x="405" y="588" fill="#f09a73">canonicalize</text>

    <path class="flow flow-soft" d="M828 620 C758 586 726 548 698 504" stroke="#a39af6" marker-end="url(#arrowPurple)"/>
    <text class="label" x="730" y="588" fill="#a39af6">lineage + failures</text>

    <path class="flow" d="M878 572 C1042 520 1052 160 768 155" stroke="#a39af6" stroke-dasharray="8 8" marker-end="url(#arrowPurple)" opacity="0.60"/>
    <text class="label" x="979" y="348" fill="#a39af6" transform="rotate(-72 979 348)">slow loop: operators · costs · specs</text>
  </g>

  <!-- Center substrate -->
  <g id="substrate">
    <rect class="center" x="424" y="292" width="352" height="266" rx="28"/>
    <text class="center-title" x="600" y="325" text-anchor="middle">Five-graph substrate</text>
    <text class="center-subtitle" x="600" y="349" text-anchor="middle">the durable center of truth</text>

    <g transform="translate(456 374)">
      <rect class="pill" x="0" y="0" width="132" height="34" rx="10" fill="#34332e" stroke="#777467"/>
      <text class="pill-text" x="66" y="22" text-anchor="middle" fill="#ddd8c3">SpecGraph</text>

      <rect class="pill" x="156" y="0" width="140" height="34" rx="10" fill="#34332e" stroke="#777467"/>
      <text class="pill-text" x="226" y="22" text-anchor="middle" fill="#ddd8c3">CodeGraph</text>

      <rect class="pill" x="0" y="52" width="132" height="34" rx="10" fill="#34332e" stroke="#777467"/>
      <text class="pill-text" x="66" y="74" text-anchor="middle" fill="#ddd8c3">ProposalGraph</text>

      <rect class="pill" x="156" y="52" width="140" height="34" rx="10" fill="#34332e" stroke="#777467"/>
      <text class="pill-text" x="226" y="74" text-anchor="middle" fill="#ddd8c3">EvidenceGraph</text>

      <rect class="pill" x="58" y="104" width="180" height="34" rx="10" fill="#34332e" stroke="#777467"/>
      <text class="pill-text" x="148" y="126" text-anchor="middle" fill="#ddd8c3">LineageGraph</text>
    </g>

    <path d="M456 522 H744" stroke="rgba(222,218,196,0.22)" stroke-width="1"/>
    <text class="center-subtitle" x="600" y="537" text-anchor="middle">projection boundary: no artifact bypasses graph form</text>
  </g>

  <!-- Top card: spec input -->
  <g id="spec-input">
    <rect class="card" x="424" y="122" width="352" height="96" rx="20"/>
    <text class="card-kicker" x="600" y="148" text-anchor="middle" fill="#a39af6">SPEC INPUT</text>
    <text class="card-title" x="600" y="174" text-anchor="middle">Tiered constraints enter as structure</text>
    <text class="body" x="600" y="197" text-anchor="middle">Charter · domain model · contracts · protocols · invariants</text>
  </g>

  <!-- Left card: candidates -->
  <g id="candidate-loop">
    <rect class="card" x="80" y="274" width="292" height="154" rx="22"/>
    <text class="card-kicker" x="226" y="303" text-anchor="middle" fill="#73b8ff">LM CANDIDATES</text>
    <text class="card-title" x="226" y="329" text-anchor="middle">Generate only proposed deltas</text>
    <text class="body" x="226" y="357" text-anchor="middle">patch candidates</text>
    <text class="body" x="226" y="379" text-anchor="middle">module decomposition</text>
    <text class="body" x="226" y="401" text-anchor="middle">adapter sketches · test hypotheses</text>
  </g>

  <!-- Right card: evidence -->
  <g id="evidence-loop">
    <rect class="card" x="828" y="274" width="292" height="154" rx="22"/>
    <text class="card-kicker" x="974" y="303" text-anchor="middle" fill="#6ee0c3">EVIDENCE + ADVERSARY</text>
    <text class="card-title" x="974" y="329" text-anchor="middle">Acceptance is falsification-resistant</text>
    <text class="body" x="974" y="357" text-anchor="middle">compile · tests · traces</text>
    <text class="body" x="974" y="379" text-anchor="middle">property checks · counterexamples</text>
    <text class="body" x="974" y="401" text-anchor="middle">nogoods · rejected drift</text>
  </g>

  <!-- Bottom-left card: normalization -->
  <g id="normalization">
    <rect class="card" x="96" y="576" width="304" height="140" rx="22"/>
    <text class="card-kicker" x="248" y="605" text-anchor="middle" fill="#f09a73">NORMALIZATION</text>
    <text class="card-title" x="248" y="631" text-anchor="middle">No raw output becomes truth</text>
    <text class="body" x="248" y="659" text-anchor="middle">parse → ENF → typed patch</text>
    <text class="body" x="248" y="681" text-anchor="middle">canonical names · edge constraints</text>
    <text class="small" x="248" y="702" text-anchor="middle">reject ambiguity before it can accumulate</text>
  </g>

  <!-- Bottom-right card: harness evolution -->
  <g id="harness-evolution">
    <rect class="card" x="800" y="576" width="304" height="140" rx="22"/>
    <text class="card-kicker" x="952" y="605" text-anchor="middle" fill="#a39af6">HARNESS EVOLUTION</text>
    <text class="card-title" x="952" y="631" text-anchor="middle">Failures update the machinery</text>
    <text class="body" x="952" y="659" text-anchor="middle">operator weights · rule updates</text>
    <text class="body" x="952" y="681" text-anchor="middle">benchmark harness · pipeline versions</text>
    <text class="small" x="952" y="702" text-anchor="middle">the generator becomes a governed object</text>
  </g>

  <!-- Bottom trace -->
  <g id="judgment-trace">
    <path class="flow" d="M600 558 V654" stroke="#c6c2b3" stroke-dasharray="5 6" marker-end="url(#arrowNeutral)" opacity="0.58"/>
    <rect class="trace" x="360" y="694" width="480" height="78" rx="20"/>
    <text class="card-title" x="600" y="724" text-anchor="middle">Judgment trace — the real product</text>
    <text class="body" x="600" y="750" text-anchor="middle">spec → candidate → violation → rewrite → accepted form</text>
  </g>

  <!-- Artifact taxonomy -->
  <g id="artifact-taxonomy">
    <text class="subtitle" x="600" y="808" text-anchor="middle">Every artifact is exactly one of four things:</text>
    <g transform="translate(252 829)">
      <circle class="dot" cx="0" cy="0" r="6" fill="#a39af6"/>
      <text class="legend-text" x="14" y="4">projection</text>
      <circle class="dot" cx="172" cy="0" r="6" fill="#73b8ff"/>
      <text class="legend-text" x="186" y="4">proposed mutation</text>
      <circle class="dot" cx="392" cy="0" r="6" fill="#6ee0c3"/>
      <text class="legend-text" x="406" y="4">evidence</text>
      <circle class="dot" cx="552" cy="0" r="6" fill="#f09a73"/>
      <text class="legend-text" x="566" y="4">rejected drift</text>
    </g>
  </g>
</svg>
